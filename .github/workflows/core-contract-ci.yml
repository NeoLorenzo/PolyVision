name: Core Phase 1 contract and parity checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-contract-and-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run core Phase 1 contract and parity checks
        run: python tools/run_core_ci_checks.py
